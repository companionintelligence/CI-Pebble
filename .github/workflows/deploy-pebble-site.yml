name: Deploy pebble.ci.computer

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/inject-ga.mjs"
      - "wrangler.toml"
      - ".github/workflows/deploy-pebble-site.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Injects GA4 into every HTML file's <head> at deploy time. No-op unless
      # the repo variable GA_MEASUREMENT_ID is set to a valid G-XXXX id:
      #   gh variable set GA_MEASUREMENT_ID --body G-XXXX --repo companionintelligence/CI-Pebble
      - name: Inject Google Analytics
        env:
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
        run: node scripts/inject-ga.mjs site

      # Requires two repo secrets that are NOT set by this workflow file:
      #   CLOUDFLARE_API_TOKEN   — a token scoped to Cloudflare Pages:Edit
      #   CLOUDFLARE_ACCOUNT_ID  — the Cloudflare account that owns the
      #                            ci-pebble Pages project and the
      #                            ci.computer zone
      # See site/README.md for how to create both and wire up the
      # pebble.ci.computer custom domain.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=ci-pebble
