<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="rounded">
      <rect x="0" y="0" width="512" height="512" rx="112" ry="112"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <rect x="0" y="0" width="512" height="512" fill="#0055ff"/>

    <!-- watch face -->
    <circle cx="256" cy="256" r="150" fill="#ffffff"/>

    <!-- crown notch, top-right, suggesting a wearable -->
    <rect x="378" y="150" width="34" height="54" rx="10" fill="#0055ff"/>

    <!-- recall pulse rings -->
    <circle cx="256" cy="256" r="96" fill="none" stroke="#0055ff" stroke-width="14" stroke-opacity="0.28"/>
    <circle cx="256" cy="256" r="62" fill="none" stroke="#0055ff" stroke-width="14" stroke-opacity="0.55"/>

    <!-- memory node -->
    <circle cx="256" cy="256" r="26" fill="#0055ff"/>
  </g>
</svg>
